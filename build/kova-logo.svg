<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Back ring (behind planet) -->
  <ellipse cx="256" cy="256" rx="230" ry="70" transform="rotate(-25 256 256)" fill="none" stroke="url(#ringGrad)" stroke-width="18" stroke-linecap="round" opacity="0.4" stroke-dasharray="0 362 360 0"/>
  <!-- Planet body -->
  <circle cx="256" cy="256" r="130" fill="url(#planetGrad)"/>
  <!-- Planet shine highlight -->
  <circle cx="220" cy="220" r="90" fill="white" opacity="0.08"/>
  <circle cx="210" cy="210" r="50" fill="white" opacity="0.06"/>
  <!-- Front ring (in front of planet) -->
  <ellipse cx="256" cy="256" rx="230" ry="70" transform="rotate(-25 256 256)" fill="none" stroke="url(#ringGrad)" stroke-width="18" stroke-linecap="round" opacity="0.9" stroke-dasharray="362 0 0 360"/>
</svg>
